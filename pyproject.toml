[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "philo-rag"
version = "1.2.0"
description = "《哲学大纲》知识库：引用溯源问答、术语索引与语义检索、体系浏览"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.26",
    "rank_bm25>=0.2.2",
    "jieba>=0.42.1",
    "PyMuPDF>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.7"]   # 真正的语义向量（推荐）
docx = ["python-docx>=1.1"]                 # 解析 Word 语料
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]  # 测试与静态检查（httpx 供 fastapi TestClient）

[project.scripts]
philo-rag = "philo_rag.cli:main"

[tool.setuptools]
packages = ["philo_rag"]

# 前端静态资源随包分发（纯 HTML/CSS/JS，无构建步骤）
[tool.setuptools.package-data]
philo_rag = ["web/*.html", "web/css/*.css", "web/js/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# pycodestyle 的错误子集 + pyflakes（未定义名、未用导入）+ import 排序。
# 只选确定性、无需人工判断的规则，避免为了过检查而改写风格。
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# scripts 是独立入口脚本：先插 sys.path 再导入项目包，导入必然不在文件顶部。
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
