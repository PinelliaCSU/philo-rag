<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哲学大纲 · 知识库</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<header>
  <h1>哲学大纲 · 知识库</h1>
</header>

<nav class="tabbar" id="panel-nav" aria-label="功能面板">
  <button type="button" class="tab" data-p="concept" aria-pressed="false">概念卡</button>
  <button type="button" class="tab" data-p="search" aria-pressed="false">术语 / 引文检索</button>
  <button type="button" class="tab" data-p="map" aria-pressed="false">体系地图</button>
  <button type="button" class="tab" data-p="notes" aria-pressed="false">笔记</button>
  <button type="button" class="tab" data-p="history" aria-pressed="false">历史</button>
  <button type="button" class="tab" data-p="compare" aria-pressed="false">对比</button>
</nav>

<main>

  <!-- ============ 主入口：溯源回答（唯一主视图，永远可见） ============ -->
  <section class="view on" id="v-ask">
    <div class="ask-top">
      <div class="row">
        <span class="label">提问方式</span>
        <div class="seg" id="seg-strategy">
          <button type="button" data-s="auto" class="on" aria-pressed="true">自动判定</button>
          <button type="button" data-s="point" aria-pressed="false">点查询</button>
          <button type="button" data-s="theme" aria-pressed="false">范围查询</button>
        </div>
        <span class="muted" id="strategy-scope"></span>
      </div>
      <div class="row" id="strategy-egs"></div>
      <div class="row ask-input-row">
        <input type="text" id="q" placeholder="输入问题或主题…">
        <button id="ask-btn">提问</button>
        <button type="button" class="ghost" id="conv-new">新对话</button>
      </div>
      <div class="row conv-row">
        <span class="label">最近提问</span>
        <div class="conv-chips" id="conv-chips"></div>
      </div>
    </div>

    <div class="ask-body">
      <!-- 初始提示卡由 app.js 的 ASK_INTRO_HTML 渲染：骨架渲染会覆盖本区域，
           只有把它收进一个常量，点「新对话」才能复原出同一张卡 -->
      <div class="answer-pane" id="ask-out">
        <div class="muted">界面加载中…</div>
      </div>

      <div class="cite-pane">
        <div class="pane-head">
          <h3>引用来源</h3>
          <div class="pager" id="cite-pager"></div>
        </div>
        <div class="cite-cards" id="cite-cards">
          <div class="muted">提问后，每条论断的来源在这里逐条浏览。</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 连续阅读：全宽视图（侧栏宽度不适合长文阅读） ============ -->
  <section class="view" id="v-read">
    <div class="read-bar">
      <button type="button" class="ghost" id="read-prev" data-read-nav="">上一单元</button>
      <div class="read-title" id="read-title"></div>
      <button type="button" class="ghost" id="read-next" data-read-nav="">下一单元</button>
      <div class="read-tools">
        <button type="button" class="ghost" id="read-font-dec">字号-</button>
        <button type="button" class="ghost" id="read-font-inc">字号+</button>
        <button type="button" class="ghost" id="read-back">返回地图</button>
      </div>
    </div>
    <div class="read-body" id="read-out"></div>
  </section>

  <!-- ============ 可召唤侧栏：概念卡 / 检索 / 体系地图 ============ -->
  <aside class="panel" id="panel" aria-label="功能面板">
    <div class="panel-head">
      <h3 id="panel-title">概念卡</h3>
      <button class="ghost" id="panel-close">关闭</button>
    </div>
    <div class="panel-body">

      <!-- 面板一：概念卡 -->
      <section class="panel-pane on" id="pane-concept">
        <div class="row concept-form">
          <input type="text" id="concept-q" placeholder="输入术语，如：大他者 / 客体小a / 场域论">
          <button id="concept-go">查看概念卡</button>
        </div>
        <div id="concept-out">
          <div class="card muted">输入术语查看概念卡；也可以点击回答正文「术语注解」里的术语直接打开。</div>
        </div>
      </section>

      <!-- 面板二：术语 / 引文检索 -->
      <section class="panel-pane" id="pane-search">
        <div class="search-top">
          <div class="row">
            <span class="label">检索方式</span>
            <div class="seg" id="seg-search">
              <button type="button" data-m="term" class="on" aria-pressed="true">术语 / 概念</button>
              <button type="button" data-m="quote" aria-pressed="false">引文 / 原话</button>
            </div>
            <span class="muted" id="search-scope"></span>
          </div>
          <div class="row" id="search-form"></div>
        </div>
        <div class="search-body">
          <div id="search-head"></div>
          <div id="search-list"></div>
          <div class="pager-row" id="search-pager"></div>
        </div>
      </section>

      <!-- 面板三：体系地图 -->
      <section class="panel-pane" id="pane-map">
        <div class="map-body" id="map-out"></div>
      </section>

      <!-- 面板四：笔记与书签（只存浏览器本地，不上传、不写库） -->
      <section class="panel-pane" id="pane-notes">
        <div class="notes-top">
          <div class="muted">收藏与批注保存在浏览器本地（localStorage），不上传、不写库；
            在引用卡或单元面板的原文块上点「☆ 收藏」即可加入，导出 Markdown 后可自行归档。</div>
          <div class="row">
            <button id="notes-export" class="ghost">导出 Markdown</button>
            <button id="notes-clear" class="ghost">清空</button>
          </div>
        </div>
        <div id="notes-out"></div>
      </section>

      <!-- 面板五：问答历史（只存浏览器本地；引用正文按 chunk_id 回捞，不存本地） -->
      <section class="panel-pane" id="pane-history">
        <div class="notes-top">
          <div class="muted">每次回答生成完自动记一条，保存在浏览器本地（与「笔记」分开存放）；
            引用只存坐标不存正文，点引用卡的「展开全文」按需回捞。</div>
          <div class="row">
            <input type="text" id="hist-filter" placeholder="过滤：匹配问题或改写后的问题">
          </div>
          <div class="row">
            <button id="hist-export-json" class="ghost">导出 JSON（备份）</button>
            <button id="hist-export-md" class="ghost">导出 Markdown</button>
          </div>
        </div>
        <div id="hist-out"></div>
      </section>

      <!-- 面板六：概念对比（概念 vs 概念；理论家对比本轮不做） -->
      <section class="panel-pane" id="pane-compare">
        <div class="row concept-form">
          <input type="text" id="cmp-a" placeholder="概念 A，如：大他者">
          <input type="text" id="cmp-b" placeholder="概念 B，如：客体小a">
        </div>
        <div class="row cmp-go-row">
          <button id="cmp-go">对比</button>
        </div>
        <div id="cmp-out">
          <div class="card muted">输入两个概念，比较它们的定义、归属、共现概念与引文差异。</div>
        </div>
      </section>

    </div>
  </aside>

</main>

<!-- 原文上下文弹窗 -->
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title">原文上下文</h3>
      <button class="ghost" id="modal-close">关闭</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
