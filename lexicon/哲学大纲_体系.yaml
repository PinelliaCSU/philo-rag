title: 哲学大纲
note: 由 scripts/gen_taxonomy.py 从规范化语料自动生成，勿手工编辑单元目录部分
volumes:
- 第 1 卷 实在论
- 第 2 卷 形而上学
- 第 3 卷 观念论
- 第 4 卷 实践
axes:
  字头:
  - code: '1'
    name: 形而下学
    alias: 实在论 / Realism
    note: 尚未拥有自身本体论与自然学的状态，默认一个融贯均匀的场，一切皆可被对象化定位
  - code: '2'
    name: 形而上学
    alias: Metaphysics
    note: 意识到「存在者整体」与「一切之所在」（场）之间的二分张力
  - code: '3'
    name: 观念论
    alias: Idealism
    note: 把握主体性作为符号系统的动力学机制，以「无」为不可填充的匮乏
  - code: '4'
    name: 实践
    alias: Practice
    note: 坚持总体与总体化之差异、并随时对哲学姿态保持警惕的辩证唯物主义姿态
  四层:
  - code: '1'
    name: 场域论
    alias: field
    note: 编号第一位：存在者整体所处之场如何被设想
  - code: '2'
    name: 本体论
    alias: ontology
    note: 编号第二位：存在者整体被如何把握
  - code: '3'
    name: 认识论
    alias: epistemology
    note: 编号第三位：知识如何可能、主体以何方式通达对象
  - code: '4'
    name: 目的论
    alias: teleology
    note: 编号第四位：体系指向的终极目标或运动方向
  四话语:
  - code: '1'
    name: 主人话语
    alias: master's discourse
    note: 以主人能指为动因，命令被划杠的主体去生产知识，其真相是剩余快感
  - code: '2'
    name: 大学话语
    alias: university discourse
    note: 以知识为动因，把主体安置为被研究对象，是一字头科学主义的典型结构
  - code: '3'
    name: 癔症话语
    alias: hysteric's discourse
    note: 以被划杠的主体为动因，向主人质询「我是什么」，是问题意识的来源
  - code: '4'
    name: 分析家话语
    alias: analyst's discourse
    note: 以对象a为动因，反转大学话语，指向剩余快感与症状的真相
