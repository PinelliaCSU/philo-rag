# ============================================================================
# Philo-RAG 配置 · 哲学大纲知识库
# 数据加载 / 分块 / 向量化 / 检索 / 生成 / 输出，六段全部可调，切换只改这里
# ============================================================================

# ---------- 1. 数据加载 ----------
doc:
  id: zhuyi-zhuyi-001
  title: 哲学大纲
  # 原始语料（采集入口）：prepare 命令读它。支持 .pdf / .txt / .md
  raw: ../哲学大纲_规范化_全集.pdf
  # 清洗产物（索引入口）：build 命令读它。由 prepare 命令生成
  source: data/哲学大纲_规范化_全集.txt
  store_dir: store
  # 清洗选项
  strip_annotations: false    # true 则剔除【释：】【按：】【补：】整理者标注
  skip_front_matter: false    # false 则保留体例说明与体系总纲（含「字头」等关键定义）

# ---------- 2. 词典（元数据抽取的来源，决定检索精度）----------
lexicon:
  philosophers: lexicon/philosophers.yaml   # 理论家：别名归一 + 生卒年 + 流派
  concepts: lexicon/concepts.yaml           # 概念：别名 + 归属 + 定义
  taxonomy: lexicon/哲学大纲_体系.yaml        # 体系目录：字头 / 四层 / 四话语 / 338 单元
  themes: lexicon/themes.yaml                # 主题（流派/思潮）：名称 + 别名 + 理论家/概念/单元锚点

# ---------- 3. 分块 ----------
chunk:
  max_chars: 480            # 单块上限（超过则按句边界再切）
  min_chars: 140            # 低于此长度与相邻段合并
  overlap_chars: 120        # 因长度切分时的重叠，避免切断论证
  split_quotes: true        # 引文单独成块（供「按理论家/概念检索引文」）
  quote_min_chars: 12       # ASCII 直引号成对抽取的最小长度（滤掉术语强调）
  quote_min_chars_reliable: 6  # 「」/“” 可靠标记的最小长度（可放宽）
  keep_footnotes: true      # 脚注单独成块
  enrich_embed_text: true   # 向量/BM25 的输入 = 章节路径 + 元数据标签 + 正文

# ---------- 4. 向量化 ----------
embedding:
  # sentence_transformer（本地语义向量，推荐）| hashing（离线词法近似）| api（云端）
  backend: sentence_transformer
  model: models/bge-base-zh-v1.5   # 中文语义模型（768 维）；已从 bge-small-zh-v1.5 升级
  dim: 512                          # 仅 hashing 后端使用
  batch_size: 64
  device: cpu                       # cpu | cuda
  api_base: ""                      # backend=api 时填写，形如 https://api.xxx.com/v1
  api_key: ""

# ---------- 5. 检索 ----------
retrieval:
  dense_top_k: 40           # 稠密路候选数
  sparse_top_k: 40          # 稀疏（BM25）路候选数
  fusion: rrf               # 倒数排名融合
  rrf_k: 60
  dense_weight: 1.0         # 稠密路权重（hashing 后端建议降到 0.3）
  sparse_weight: 1.0        # 稀疏路权重
  entity_boost: 0.004       # 查询实体被块元数据命中时的加分（消除 RRF 平票）
  definition_boost: 0.02    # 问「什么是 X」时，块内出现 X 定义句式的加分
  final_top_k: 8            # 最终返回条数
  expand_query: true        # 用词典做查询扩展（术语 → 别名 / 外文名）
  rerank: true              # true 需 sentence-transformers 的 CrossEncoder 与本地重排模型
  rerank_model: models/bge-reranker-v2-m3   # 本地重排模型路径（相对项目根）；离线部署用
                                            # 有网环境也可填 HF 名 BAAI/bge-reranker-v2-m3
  rerank_top_k: 12          # 只重排融合后的前 N 个候选（须 > final_top_k，留提升余量）；
                            # CPU 上每多 1 个候选约多 0.3~0.6 秒，调小可降低每次提问的延迟
  rerank_max_chars: 256     # 每个候选只把前 N 个字符喂给重排器（0 = 整块不截断）；
                            # 交叉编码器耗时随长度线性增长，截断后每次提问快约一倍，
                            # 实测检索质量不降（Hit@1/MRR 见 README「重排」一节）

# ---------- 6. 生成 ----------
answer:
  # 说明：溯源回答固定对**整篇语料**做全文检索，不接受单元/概念/理论家等筛选条件。
  # 筛选会先缩小候选池，容易把承载概念定义的段落（常在前言/总纲/其他单元）排除在外。
  # 需要按维度浏览请用 term / quote / facets 三类入口。
  #
  # 三种后端：
  #   api      —— 任意 OpenAI 兼容 /chat/completions 接口（默认，接阿里云百炼 DashScope）
  #   ollama   —— 本地模型（数据不出本机，需常驻 Ollama 服务）
  #   template —— 离线抽取式，不调用任何模型（用于自检与降级）
  backend: api
  strategy: auto            # auto 按问题自动判定 | point 强制点查询 | theme 强制范围查询
  clarify_broad: true       # 裸主题提问（如「黑格尔」「谈谈精神分析」）先反问方向，不直接生成长文

  # —— 云端 API（backend: api）——
  # 默认阿里云百炼（DashScope）OpenAI 兼容模式；换任何 OpenAI 兼容服务只改这三行。
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 密钥不写明文：在项目根目录的 .env 里设 DASHSCOPE_API_KEY=sk-xxx
  # （.env 已在 .gitignore 中，不会被提交）；也可直接把 key 填在这里。
  api_key: ${DASHSCOPE_API_KEY}
  api_model: qwen-plus      # 百炼模型名：qwen-plus / qwen-max / qwen-turbo …
  api_model_point: qwen-plus  # 点查询专用（3-5 段数百字，turbo 更快且够用）
  api_model_theme: qwen-plus   # 范围查询专用（1500-4000 字长文，需更强模型）
  api_max_tokens: 8192      # 输出上限；范围查询要写 1500–4000 字，必须给足
  api_timeout: 300          # 单次请求超时（秒）；范围查询上下文大、耗时较长
  api_retries: 2            # 429 / 5xx / 网络错误的自动退避重试次数
  api_extra: {}             # 需要时透传额外参数，如 {enable_thinking: false}

  # —— 本地 Ollama（backend: ollama，可选）——
  ollama_base: http://localhost:11434
  ollama_model: qwen2.5:7b  # 留空则回退到 model

  # —— 通用 ——
  model: qwen-plus          # 未单独指定 api_model / ollama_model 时的默认模型
  max_context_chunks: 8
  candidate_chunks: 20       # 点查询的候选证据数，再压缩为少量论证段
  temperature: 0.2
  max_answer_chars: 850     # 点查询提示词里对回答长度的约束
                            # 比早期的 700 放宽：现在每个术语首次出现都要带「（即…）」
                            # 解释，内联解释本身要吃掉 100—150 字，按 700 约束模型会稳定超限。
  # —— 原文优先/编辑式（quote_first）旋钮 ——
  # quote_first 模式：原文即正文，LLM 只做节标题、单元串接语、极少量过渡；
  # 术语解释作为 annotations 数组随 payload/渲染输出，不混进正文。
  bridge_max_chars: 60      # 每节衔接/过渡语上限（字）
  quote_first: true         # 旧旋钮：false 等价于 prompt_style: legacy
  prompt_style: quote_first # quote_first | legacy（A/B 切换）
  theme_min_chars: 1500     # 范围查询（LLM 后端）成篇篇幅下限
  theme_max_chars: 4000     # 范围查询（LLM 后端）成篇篇幅上限

# ---------- 6c. 范围查询策略参数（溯源回答的 theme 分支）----------
# 溯源回答是一个入口，内部按问题诉求选召回策略：
#   point —— 「定位一句出处」：top-k 少而准，回答数百字。
#   theme —— 「某主题在全书的面貌」：高召回 + 按单元聚合 + 长上下文，
#            回答按体系结构分节，与离线时代的「专题提炼稿」同量级。
# 二者共用同一索引，只是召回规模与组织方式不同。配置切换只改这里。
theme:
  seed_top_k: 60            # 已弃用；未登录主题不再用语义种子反推主题锚点
  semantic_top_k: 40        # 已弃用；范围回答只使用可核对的直接证据
  group_gap: 3              # 块序差 ≤ 此值视为连续，合并为一个段落群
  max_units: 12             # 参与组装的单元数上限（按命中数排序）
  groups_per_unit: 3        # 每个单元取几个段落群
  max_group_chars: 1200     # 单个段落群进入上下文的字符上限
  context_budget: 16000     # 上下文总字符预算（喂给 LLM 用；离线后端不消耗）
                            # 从 24000 降到 16000：段落群先经 _theme_sentences 筛选去掉无关句，
                            # 同等信息密度下输入 token 更少，范围查询生成快 20-30%
  core_units: 6             # 离线后端：详写的核心单元数
  extended_units: 6         # 离线后端：简述的衍生单元数
  answer_chars_per_unit: 340  # 离线后端：每个核心单元的主题句群字符上限

# ---------- 6b. 问题闸门（检索前置过滤）----------
# 溯源问答的最前端关卡：不适合检索的问题在此直接跳过，不进入检索与生成。
# 拦截类别：social 寒暄 / meta 系统询问 / fragment 碎片追问 / too_short 过短 /
#           off_topic 实时信息与通用任务 / no_anchor 无锚点又无实词 /
#           irrelevant 语义相关性兜底（与语料相似度过低的无锚点问题）
gate:
  enabled: true             # false 则所有问题都进入检索（等价于 CLI 的 --no-gate）
  min_chars: 4              # 归一化后短于此长度、且无锚点无实词时判为退化输入
  strict: false             # true 时「无词典/体系锚点」的问题一律拦截（更严，易误杀）
  hint: ""                  # 跳过时给出的改写建议；留空使用内置默认文案
  relevance: true           # 语义相关性格挡：硬编码模式覆盖不到的垃圾问题按「与语料相似度」兜底
  relevance_threshold: 0.48 # 查询与语料的最高余弦相似度低于此值（且无锚点）即跳过；
                            # 按 bge-base-zh-v1.5 标定（相关 min≈0.55 / 垃圾 max≈0.44）；
                            # 换嵌入模型需重新标定；hashing 后端此闸门自动放行

# ---------- 7. 结果输出 ----------
output:
  format: md                # md | json | jsonl | csv | txt（CLI --format 可覆盖）
  dir: outputs              # 输出目录
  show_citations: true      # 是否附引用来源
  citation_style: full      # full（书名·章节·字符区间）| short（章节）
  top_k: 8
